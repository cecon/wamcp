[package]
name = "wamcp"
version = "26.10.10"
description = "WhatsApp sessions as authenticated MCP servers"
authors = ["Cappyfy"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
wamcp-server = { path = "server" }

[workspace]
members = [".", "server"]
