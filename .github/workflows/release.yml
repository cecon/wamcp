name: Windows release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Confirm merged PR and its approved CI
        id: release
        run: node scripts/release-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Bump build version
        id: version
        run: node scripts/release-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run prepare:desktop
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Prepare signed update feed and checksums
        run: node scripts/release-artifacts.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: wamcp-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Recheck main and CI immediately before publication
        id: recheck
        run: node scripts/release-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish release from verified merge commit
        if: steps.recheck.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe,src-tauri/target/release/bundle/nsis/*.sig,src-tauri/target/release/bundle/nsis/latest.json,src-tauri/target/release/bundle/nsis/SHA256SUMS.txt | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --target $env:RELEASE_SHA --title "WA MCP $env:RELEASE_TAG" --generate-notes
